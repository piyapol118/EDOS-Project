apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-mid-yoyo-script
  namespace: default
data:
  locustfile.py: |
    import random
    import string
    import time
    import socket
    import hashlib
    import urllib3
    from locust import HttpUser, task, LoadTestShape

    urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

    # ─── คำนวณ Offset และ Rate ประจำตัว Pod ─────────────────────
    POD_NAME = socket.gethostname()
    POD_HASH = int(hashlib.md5(POD_NAME.encode()).hexdigest(), 16)
    POD_OFFSET = POD_HASH % 15  # เหลื่อมเวลา 0 ถึง 14 วินาที

    # สุ่มอัตราการยิงไม่เท่ากันในแต่ละ Pod (0.70x ถึง 1.40x ของค่ามาตรฐาน)
    # ทำให้แต่ละ Pod ใน 25 Pods มีความเร็วไม่เท่ากัน กระจายตัวแบบธรรมชาติ
    POD_RATE_FACTOR = 0.70 + ((POD_HASH >> 4) % 71) / 100.0

    def random_username(n=8):
        return ''.join(random.choices(string.ascii_lowercase + string.digits, k=n))

    class MidYoYoUser(HttpUser):
        connection_timeout = 30.0
        network_timeout = 30.0

        def wait_time(self):
            # วงรอบ 15 วินาทีแบบเดียวกับ normal-traffic พร้อม POD_OFFSET
            current_phase = int(time.time() + POD_OFFSET) % 15
            
            # 4 วินาทีแรก (Burst): ยิงเร่งขึ้น (~3-5 req/s)
            # 11 วินาทีหลัง (Normal): ยิงความถี่ Medium ปกติ (~1-2 req/s)
            if current_phase < 4:
                mean_wait = 0.25 * POD_RATE_FACTOR
            else:
                mean_wait = 0.65 * POD_RATE_FACTOR

            return random.expovariate(1.0 / max(mean_wait, 0.05))

        @task
        def attack_login_simple(self):
            payload = {
                "username": random_username(),
                "password": random_username(12),
            }
            with self.client.post(
                "/api/login-simple",
                json=payload,
                verify=False,
                catch_response=True,
            ) as resp:
                if resp.status_code in (401, 200):
                    resp.success()

    class YoYoShape(LoadTestShape):
        """
        Yo-Yo Pattern for Mid Bots with Distributed Pod Offset:
        - Cycle Time: 120 seconds
        - ON Phase (80s): 3 users per pod (Medium rate attack)
        - OFF Phase (40s): 0 users (Cooldown phase)
        - Staggered by POD_OFFSET across pods
        """
        CYCLE_TIME = 120
        ON_DURATION = 80
        TARGET_USERS = 3

        def tick(self):
            # ใช้เวลาจริง + POD_OFFSET เพื่อให้แต่ละ Pod สลับรอบ ON/OFF เหลื่อมเวลากันเล็กน้อย
            current_step = int(time.time() + POD_OFFSET) % self.CYCLE_TIME

            if current_step < self.ON_DURATION:
                return (self.TARGET_USERS, 2)  # ON Phase
            else:
                return (0, 2)                  # OFF Phase
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-mid-yoyo
  namespace: default
spec:
  replicas: 25
  selector:
    matchLabels:
      app: locust-mid-yoyo
  template:
    metadata:
      labels:
        app: locust-mid-yoyo
    spec:
      containers:
      - name: locust
        image: locustio/locust:2.31.1
        imagePullPolicy: IfNotPresent
        args:
          - "-f"
          - "/config/locustfile.py"
          - "--host=https://nginx-sidecar-service:80"
          - "--headless"
          - "--run-time=15m"
        volumeMounts:
        - name: locust-script
          mountPath: /config
        resources:
          requests:
            cpu: "25m"
            memory: "48Mi"
          limits:
            cpu: "60m"
            memory: "96Mi"
      volumes:
      - name: locust-script
        configMap:
          name: locust-mid-yoyo-script
