apiVersion: v1
kind: ConfigMap
metadata:
  name: normal-traffic-script
  namespace: default
data:
  locustfile.py: |
    import random
    import time
    import socket
    import hashlib
    import urllib3
    from locust import HttpUser, task

    urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

    POD_NAME = socket.gethostname()
    POD_OFFSET = int(hashlib.md5(POD_NAME.encode()).hexdigest(), 16) % 15

    class RealisticDistributedUser(HttpUser):
        def wait_time(self):
            current_phase = int(time.time() + POD_OFFSET) % 15
            
            if current_phase < 4:
                return random.expovariate(1.0 / 0.15)
            else:
                return random.expovariate(1.0 / 1.5)

        @task
        def browse_and_login(self):
            payload = {
                "username": f"user_{random.randint(1000, 9999)}",
                "password": "sample_password"
            }
            with self.client.post(
                "/api/login-simple",
                json=payload,
                verify=False,
                catch_response=True
            ) as resp:
                if resp.status_code in (200, 401):
                    resp.success()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: normal-traffic
  namespace: default
spec:
  replicas: 15
  selector:
    matchLabels:
      app: normal-traffic
  template:
    metadata:
      labels:
        app: normal-traffic
    spec:
      containers:
      - name: locust
        image: locustio/locust:2.31.1
        imagePullPolicy: IfNotPresent
        args:
          - "-f"
          - "/config/locustfile.py"
          - "--host=https://nginx-sidecar-service:80"
          - "--headless"
          - "--users=1"
          - "--spawn-rate=1"
          - "--run-time=15m"
        volumeMounts:
        - name: locust-script
          mountPath: /config
        resources:
          requests:
            cpu: "20m"
            memory: "48Mi"
          limits:
            cpu: "50m"
            memory: "96Mi"
      volumes:
      - name: locust-script
        configMap:
          name: normal-traffic-script
