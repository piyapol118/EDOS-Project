apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-sidecar-config
  namespace: default
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    static_resources:
      listeners:
      - name: ingress_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 10000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              xff_num_trusted_hops: 0
              use_remote_address: true
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      timestamp: "%START_TIME%"
                      method: "%REQ(:METHOD)%"
                      path: "%REQ(:PATH)%"
                      status: "%RESPONSE_CODE%"
                      duration_ms: "%DURATION%"
                      downstream_direct_remote_address: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT%"
                      downstream_remote_address_no_port: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                      x_forwarded_for_header: "%REQ(X-FORWARDED-FOR)%"
                      x_real_ip_header: "%REQ(X-REAL-IP)%"
                      user_agent: "%REQ(USER-AGENT)%"
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: nginx_local_cluster }
              http_filters:
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      -- Global state (persist ต่อ worker thread ตลอดชีวิตของ Envoy process)
                      BLOCKED_IPS = BLOCKED_IPS or {}
                      LAST_REFRESH = LAST_REFRESH or 0

                      function envoy_on_request(request_handle)
                        local now = os.time()
                        if now - LAST_REFRESH >= 20 then
                          local ok, _ = pcall(function()
                            local headers, body = request_handle:httpCall(
                              "entropy_detector_cluster",
                              {
                                [":method"] = "GET",
                                [":path"] = "/api/blocked-ips",
                                [":authority"] = "entropy-detector-svc"
                              },
                              "",
                              3000
                            )
                            if headers[":status"] == "200" and body then
                              local new_ips = {}
                              for ip in body:gmatch('"(%d+%.%d+%.%d+%.%d+)"') do
                                new_ips[ip] = true
                              end
                              BLOCKED_IPS = new_ips
                              LAST_REFRESH = now
                            end
                          end)
                          if not ok then
                            request_handle:logWarn("entropy-detector unreachable, using cached blocked list")
                          end
                        end

                        local addr = request_handle:streamInfo():downstreamDirectRemoteAddress()
                        local ip = addr and addr:match("^(.+):%d+$")

                        if ip and BLOCKED_IPS[ip] then
                          request_handle:logWarn("BLOCKED by entropy-detector: " .. ip)
                          request_handle:respond(
                            {[":status"] = "403", ["content-type"] = "application/json"},
                            '{"error":"blocked_by_entropy_detector","ip":"' .. ip .. '"}'
                          )
                        end
                      end
              - name: envoy.filters.http.local_ratelimit
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                  stat_prefix: http_local_rate_limiter
                  token_bucket:
                    max_tokens: 500
                    tokens_per_fill: 500
                    fill_interval: 1s
                  filter_enabled:
                    runtime_key: local_rate_detector
                    default_value: { numerator: 100, denominator: HUNDRED }
                  filter_enforced:
                    runtime_key: local_rate_enforcer
                    default_value: { numerator: 100, denominator: HUNDRED }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                - certificate_chain: { filename: "/etc/envoy/certs/tls.crt" }
                  private_key: { filename: "/etc/envoy/certs/tls.key" }
      clusters:
      - name: nginx_local_cluster
        connect_timeout: 0.25s
        type: LOGICAL_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: nginx_local_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 80 }
      - name: entropy_detector_cluster
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: entropy_detector_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: entropy-detector-svc, port_value: 8080 }