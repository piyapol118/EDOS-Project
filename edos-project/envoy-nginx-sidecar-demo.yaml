apiVersion: v1
kind: Namespace
metadata:
  name: nginx-legacy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-edos-target
  namespace: nginx-legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-edos-target
  template:
    metadata:
      labels:
        app: nginx-edos-target
    spec:
      containers:
      - name: nginx
        image: python:3.11-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          python3 -u -c "
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          import math, time

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path in ['/heavy-logic', '/heavy-logic.html']:
                      start_time = time.time()
                      result = 0
                      for i in range(1, 500000):
                          result += math.sqrt(i) ** 2
                      end_time = time.time()
                      msg = f'Compute Done! Time: {end_time - start_time:.4f}s | Result: {result}\n'.encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain')
                      self.end_headers()
                      self.wfile.write(msg)
                  else:
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain')
                      self.end_headers()
                      self.wfile.write(b'Server is running. Call /heavy-logic.html to stress CPU.\n')

              def log_message(self, format, *args):
                  return

          server = ThreadingHTTPServer(('0.0.0.0', 80), Handler)
          print('Server running on port 80...')
          server.serve_forever()
          "
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 2

        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-edos-target-svc
  namespace: nginx-legacy
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: nginx-edos-target
  ports:
  - port: 80
    targetPort: 10000
    nodePort: 30401
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-edos-target
  namespace: nginx-legacy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-edos-target
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30